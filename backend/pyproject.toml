[project]
name = "subtube-api"
version = "0.1.0"
description = "SubTube API - YouTube Subscription Manager backend"
requires-python = ">=3.12"
dependencies = [
    "dj-rest-auth>=7.1.1",
    "django>=6.0.2",
    "django-allauth[socialaccount]>=65.14.3",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.16.1",
    "djangorestframework-simplejwt>=5.5.1",
    "gunicorn>=25.1.0",
    "psycopg[binary]>=3.3.2",
    "python-decouple>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-django>=4.12.0",
    "ruff>=0.15.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "subtube_api.settings.local"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
